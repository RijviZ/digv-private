<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Icon Generator</title>
</head>
<body>
  <div id="status">Rendering...</div>
  <div id="output"></div>

  <script>
    const svgString = `<svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M7.33211 25.6624C6.98523 25.6636 6.64515 25.5663 6.35135 25.3819C6.05756 25.1975 5.82212 24.9335 5.67239 24.6206C5.52266 24.3077 5.46479 23.9587 5.50549 23.6143C5.5462 23.2698 5.68381 22.9439 5.90235 22.6746L24.0493 3.97767C24.1854 3.82055 24.3709 3.71437 24.5754 3.67657C24.7798 3.63876 24.991 3.67158 25.1743 3.76963C25.3576 3.86768 25.5021 4.02514 25.5842 4.21617C25.6662 4.40719 25.6809 4.62042 25.6257 4.82087L22.1063 15.8557C22.0025 16.1334 21.9677 16.4322 22.0047 16.7264C22.0418 17.0206 22.1497 17.3014 22.3191 17.5447C22.4885 17.788 22.7145 17.9866 22.9775 18.1234C23.2405 18.2603 23.5329 18.3312 23.8294 18.3303H36.6605C37.0074 18.3291 37.3475 18.4264 37.6413 18.6108C37.9351 18.7952 38.1705 19.0592 38.3203 19.3721C38.47 19.685 38.5279 20.0339 38.4872 20.3784C38.4465 20.7229 38.3088 21.0487 38.0903 21.3181L19.9433 40.015C19.8072 40.1721 19.6217 40.2783 19.4173 40.3161C19.2129 40.3539 19.0017 40.3211 18.8184 40.223C18.635 40.125 18.4905 39.9675 18.4085 39.7765C18.3264 39.5855 18.3118 39.3722 18.3669 39.1718L21.8863 28.137C21.9901 27.8592 22.025 27.5605 21.9879 27.2663C21.9508 26.9721 21.843 26.6913 21.6735 26.448C21.5041 26.2046 21.2782 26.0061 21.0152 25.8692C20.7521 25.7324 20.4598 25.6614 20.1633 25.6624H7.33211Z" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="4.58257" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);

    img.onload = () => {
      const results = {};

      // Sizes for Android Launcher:
      // mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192
      // Notification icons: mdpi: 24, hdpi: 36, xhdpi: 48, xxhdpi: 72, xxxhdpi: 96

      // Let's generate base high-res images and resize them or generate them directly.
      // Doing it directly ensures crisp SVG rendering at target sizes!

      // 1. Legacy Launcher icons (ic_launcher.png) - background color #030712, with padding.
      // The user complained the icon is too big, let's use 30% padding (i.e. icon size is 40% of the total size).
      const launcherSizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
      results.ic_launcher = {};
      for (const [density, size] of Object.entries(launcherSizes)) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Fill background
        ctx.fillStyle = '#030712';
        ctx.fillRect(0, 0, size, size);

        // Draw icon centered with 20% padding on each side (40% total padding, 60% size)
        const padding = size * 0.20;
        const drawSize = size - (padding * 2);
        ctx.drawImage(img, padding, padding, drawSize, drawSize);

        results.ic_launcher[density] = canvas.toDataURL('image/png');
      }

      // 2. Foreground Adaptive Launcher icons (ic_launcher_foreground.png) - transparent, with padding.
      // Android adaptive icons have a 108dp size (at mdpi = 108px, hdpi = 162px, xhdpi = 216px, xxhdpi = 324px, xxxhdpi = 432px).
      // They are safe inside a 66dp center circle (safe zone).
      // Let's generate transparent foreground with substantial padding. Let's make padding 23% on each side.
      const adaptiveSizes = { mdpi: 108, hdpi: 162, xhdpi: 216, xxhdpi: 324, xxxhdpi: 432 };
      results.ic_launcher_foreground = {};
      for (const [density, size] of Object.entries(adaptiveSizes)) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Draw icon centered with 23% padding
        const padding = size * 0.23;
        const drawSize = size - (padding * 2);
        ctx.drawImage(img, padding, padding, drawSize, drawSize);

        results.ic_launcher_foreground[density] = canvas.toDataURL('image/png');
      }

      // 3. Notification icons (ic_notification.png) - transparent, white silhouette.
      // Small notifications need to be tiny and simple. Let's use 15% padding so it fits well.
      // Let's generate the drawable resource size (often 24dp to 96dp, or just one high-res ic_notification.png at xxhdpi/xxxhdpi).
      // Let's generate a single high-res ic_notification.png at 128px (or let's put it in drawable/ic_notification.png).
      // Wait, is there a single drawable/ic_notification.png or density-specific ones?
      // The output of find showed only `android/app/src/main/res/drawable/ic_notification.png`.
      // Let's generate it at 128x128 with 15% padding.
      const canvasNotif = document.createElement('canvas');
      canvasNotif.width = 128;
      canvasNotif.height = 128;
      const ctxNotif = canvasNotif.getContext('2d');
      const notifPadding = 128 * 0.15;
      const notifDrawSize = 128 - (notifPadding * 2);
      ctxNotif.drawImage(img, notifPadding, notifPadding, notifDrawSize, notifDrawSize);
      results.ic_notification = canvasNotif.toDataURL('image/png');

      // Put the JSON string in the output div so our node script can read it
      document.getElementById('output').textContent = JSON.stringify(results);
      document.getElementById('status').textContent = 'Done';
    };
  </script>
</body>
</html>
